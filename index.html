<meta property="og:title" content="NUNHA CREATIVE">
<meta property="og:description" content="Kreator visual dan digital.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238B6CFF'/%3E%3Cstop offset='1' stop-color='%23FF5E8A'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='32' fill='url(%23g)'/%3E%3Cpath d='M20 46V18h5l14 20V18h5v28h-5L25 26v20z' fill='%23fff'/%3E%3C/svg%3E">

<style>
  :root {
    --ink: #0B0F2A;
    --violet: #8B6CFF;
    --indigo: #4B3FD9;
    --rose: #FF5E8A;
    --blue: #3D7BFF;
    --teal: #1FD6C6;
    --amber: #FFB547;
    --sky: #5BC8FF;
    --mist: #F2F4FA;
    --dim: #BAC3D8;
    --serif: "Cormorant Garamond", "Times New Roman", serif;
    --sans: "Manrope", "Helvetica Neue", Arial, sans-serif;
    --pad: clamp(1.75rem, 6vw, 5.5rem);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--ink);
    color: var(--mist);
    font-family: var(--sans);
    font-weight: 300;
    font-size: clamp(1rem, 0.95rem + 0.2vw, 1.125rem);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 5px; }

  /* Latar: hanya warna yang berdekatan (ungu, indigo, merah muda, biru) agar tidak keruh */
  .aurora { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
  .b {
    position: absolute;
    width: clamp(320px, 52vw, 720px);
    aspect-ratio: 1;
    border-radius: 50%;
    filter: blur(100px);
    opacity: .62;
    will-change: transform;
  }
  .b1 { background: var(--violet); top: -16%; left: -14%;   animation: d1 26s ease-in-out infinite alternate; }
  .b2 { background: var(--rose);   top: 14%;  right: -22%;  animation: d2 30s ease-in-out infinite alternate; opacity: .5; }
  .b3 { background: var(--blue);   bottom: -22%; left: -16%; animation: d3 28s ease-in-out infinite alternate; opacity: .5; }
  .b4 { background: var(--indigo); bottom: -18%; right: -14%; animation: d4 24s ease-in-out infinite alternate; opacity: .7; }
  @keyframes d1 { to { transform: translate(16vw, 12vh) scale(1.1); } }
  @keyframes d2 { to { transform: translate(-14vw, 16vh) scale(.92); } }
  @keyframes d3 { to { transform: translate(14vw, -12vh) scale(1.12); } }
  @keyframes d4 { to { transform: translate(-14vw, -10vh) scale(1.08); } }

  /* Bayangan bawah supaya teks dan footer tetap jelas */
  .shade {
    position: fixed; inset: 0; pointer-events: none;
    background: linear-gradient(to bottom, rgba(11,15,42,0) 38%, rgba(11,15,42,.78) 100%);
  }
  .glow {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(420px circle at var(--x, 70%) var(--y, 30%),
      rgba(255, 255, 255, .14), transparent 70%);
  }
  .frame {
    position: fixed; inset: clamp(12px, 2vw, 28px);
    border: 1px solid rgba(255, 255, 255, .22);
    pointer-events: none;
  }

  .page {
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    padding: calc(var(--pad) * .8) var(--pad) calc(var(--pad) * .55);
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* Monogram */
  .mono {
    width: 3.25rem; height: 3.25rem;
    display: grid; place-items: center;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .4);
    background: rgba(255, 255, 255, .06);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    font-family: var(--serif);
    font-size: 1.75rem;
    font-weight: 400;
    line-height: 1;
    color: #fff;
  }

  .intro { align-self: end; padding-bottom: clamp(2.25rem, 6vw, 4.5rem); }

  h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 300;
    font-size: clamp(4rem, 15.5vw, 13rem);
    line-height: .95;
    letter-spacing: -0.02em;
  }
  h1 .line { display: block; overflow: hidden; padding-bottom: .14em; }
  h1 .line:nth-child(2) { padding-left: .55em; }
  h1 .line span {
    display: block;
    background: linear-gradient(100deg, #FFFFFF 10%, #FFE2BF 50%, #FFB8CC 95%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    transform: translateY(105%);
    animation: rise 1.3s cubic-bezier(.16, .84, .3, 1) forwards;
  }
  h1 .line:nth-child(2) span { animation-delay: .14s; }
  @keyframes rise { to { transform: none; } }

  .rule {
    width: clamp(4rem, 10vw, 8rem);
    height: 2px;
    background: linear-gradient(90deg, var(--amber), var(--rose), var(--violet), var(--sky));
    margin: clamp(1.5rem, 4vw, 2.75rem) 0 1.4rem;
    transform-origin: left;
    transform: scaleX(0);
    animation: draw .9s ease .9s forwards;
  }
  @keyframes draw { to { transform: scaleX(1); } }

  .fade { opacity: 0; animation: show 1s ease forwards; }
  .fade.d0 { animation-delay: .2s; }
  .fade.d1 { animation-delay: 1.1s; }
  .fade.d2 { animation-delay: 1.3s; }
  @keyframes show { to { opacity: 1; } }

  .lead {
    margin: 0;
    max-width: 30ch;
    font-size: clamp(1.0625rem, 1rem + .4vw, 1.3125rem);
    font-weight: 400;
    color: #fff;
    text-wrap: balance;
  }

  /* Ikon sosial media */
  .links {
    list-style: none; margin: 1.9rem 0 0; padding: 0;
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: clamp(.5rem, 2vw, .85rem);
    max-width: 25rem;
  }
  .links li { margin: 0; min-width: 0; }
  .links a {
    display: grid; place-items: center;
    aspect-ratio: 1;
    width: 100%;
    color: #fff;
    border: 1px solid var(--c);
    background: color-mix(in srgb, var(--c) 20%, transparent);
    border-radius: 50%;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: background .25s ease, color .25s ease, transform .25s ease;
  }
  .links svg { width: 44%; height: 44%; display: block; }
  .links a:hover, .links a:focus-visible { background: var(--c); color: var(--ink); transform: translateY(-3px); }
  .links li:nth-child(1) { --c: var(--rose); }
  .links li:nth-child(2) { --c: var(--violet); }
  .links li:nth-child(3) { --c: var(--teal); }
  .links li:nth-child(4) { --c: var(--amber); }
  .links li:nth-child(5) { --c: var(--sky); }

  footer {
    border-top: 1px solid rgba(255, 255, 255, .22);
    padding-top: 1.25rem;
    font-size: .875rem;
    color: var(--dim);
    letter-spacing: .02em;
  }

  @media (max-width: 640px) {
    .page { padding: 2.75rem 1.75rem 2rem; }
    h1 { font-size: clamp(3.5rem, 19vw, 6.5rem); line-height: 1; }
    h1 .line { padding-bottom: .16em; }
    h1 .line:nth-child(2) { padding-left: .3em; }
    .lead { max-width: 100%; }
    .mono { width: 2.9rem; height: 2.9rem; font-size: 1.55rem; }
    footer { font-size: .8125rem; }
  }
  @media (hover: none) {
    .links a:hover { transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .b { animation: none; }
    h1 .line span, .rule, .fade { animation: none; transform: none; opacity: 1; }
    .links a { transition: none; }
  }
</style>
</head>
<body>

<script>
  // Cahaya mengikuti kursor dengan gerakan halus.
  (function () {
    var root = document.documentElement;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var tx = innerWidth * .7, ty = innerHeight * .3, x = tx, y = ty, running = false;
    function step() {
      x += (tx - x) * .08; y += (ty - y) * .08;
      root.style.setProperty("--x", x + "px");
      root.style.setProperty("--y", y + "px");
      if (Math.abs(tx - x) > .5 || Math.abs(ty - y) > .5) requestAnimationFrame(step);
      else running = false;
    }
    addEventListener("pointermove", function (e) {
      tx = e.clientX; ty = e.clientY;
      if (!running) { running = true; requestAnimationFrame(step); }
    });
  })();
</script>
